<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}LabelAssay{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <a class="skip-link no-print" href="#main" tabindex="0">Skip to main content</a>
  <header class="site-header">
    <div class="container">
      <a class="site-title" href="/">LabelAssay</a>
      <span class="site-tag">Alcohol Beverage Label Check &middot; 27 CFR</span>
      <a class="no-print" href="/compare">Compare revisions</a>
      <a class="no-print" href="/review">Record a review</a>
    </div>
  </header>
  <main id="main" class="container" tabindex="-1">
    {% block main %}{% endblock %}
  </main>
  <footer class="container site-footer">
    Advisory tool &mdash; a compliance specialist makes the final decision.
    {% if version %}<span aria-hidden="true">&middot;</span> v{{ version }}{% endif %}
  </footer>
  {% block scripts %}{% endblock %}
</body>
</html>
