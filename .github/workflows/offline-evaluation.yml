name: Offline evaluation
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - run: uv run pytest -q tests/test_evaluation.py tests/test_review.py
      - run: uv run python tools/evaluate_offline.py
      - name: Publish evaluation in the run summary
        if: always()
        run: |
          if [ -f artifacts/evaluation/summary.md ]; then
            cat artifacts/evaluation/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
